name: Deploy Stock Analysis

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Pull code
        run: |
          cd /home/it/stock_analysis
          git fetch --prune "https://x-access-token:${GITHUB_TOKEN}@github.com/cnttc-phamminhoanh/stock_analysis.git" master
          git reset --hard FETCH_HEAD
          git status --short

      - name: Install package
        run: |
          cd /home/it/stock_analysis/server_BI
          npm ci --no-audit --no-fund

      - name: Install and bundle UI
        run: |
          cd /home/it/stock_analysis/client
          npm ci --no-audit --no-fund
          npm run build

      - name: Restart server
        run: |
          cd /home/it/stock_analysis/server_BI
          pm2 restart stock-api || pm2 start app.js --name stock-api
